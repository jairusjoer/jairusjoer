name: Workspace Setup
description: >-
  Set up pnpm and Node.js and install the workspace with a frozen lockfile.
  Callers must run actions/checkout before this action, since local actions
  are resolved from the (initially empty) runner workspace.

inputs:
  node-version:
    description: Node.js version to set up.
    required: false
    default: '24'

runs:
  using: composite

  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
