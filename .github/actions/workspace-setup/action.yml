name: Workspace Setup
description: >-
  Set up pnpm and Node.js and install the workspace with a frozen lockfile.
  Callers must run actions/checkout before this action, since local actions
  are resolved from the (initially empty) runner workspace.

inputs:
  node-version:
    description: Node.js version to set up.
    required: false
    default: '24'

runs:
  using: composite

  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Restore node_modules
      id: modules
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
