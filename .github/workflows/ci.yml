name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_SCOPE: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}

jobs:
  nx:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - format
          - lint:eslint
          - lint:commits
          - typecheck
          - build

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' || matrix.target == 'lint:commits') && '0' || '1' }}

      - name: Set up workspace
        uses: ./.github/actions/workspace-setup

      - name: Derive appropriate SHAs for `nx affected` commands
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Restore Nx cache
        if: contains(fromJSON('["typecheck", "build"]'), matrix.target)
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-${{ matrix.target }}-${{ github.sha }}
          restore-keys: nx-${{ matrix.target }}-

      - name: Run ${{ matrix.target }}
        run: pnpm exec nx $NX_SCOPE -t ${{ matrix.target }} -c check

  test:
    name: test
    needs: nx
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up workspace
        uses: ./.github/actions/workspace-setup

      - name: Derive appropriate SHAs for `nx affected` commands
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Restore Nx cache
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-test-${{ github.sha }}
          restore-keys: |
            nx-build-${{ github.sha }}
            nx-test-

      - name: Restore Playwright browsers
        id: playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright.outputs.cache-hit != 'true'
        run: pnpm exec nx $NX_SCOPE -t install-browsers

      - name: Run test
        run: pnpm exec nx $NX_SCOPE -t test -c check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/**/playwright-report
            apps/**/test-results
          if-no-files-found: ignore
          retention-days: 7
