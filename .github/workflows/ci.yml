name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_SCOPE: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}

jobs:
  nx:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - format
          - lint
          - typecheck
          - build
          - test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/workspace-setup

      - name: Derive appropriate SHAs for `nx affected` commands
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Restore Nx cache
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-${{ matrix.target }}-${{ github.sha }}
          restore-keys: nx-${{ matrix.target }}-

      - name: Run ${{ matrix.target }}
        run: pnpm exec nx $NX_SCOPE -t ${{ matrix.target }} -c check

      - name: Fail if the tool changed files
        run: git diff --exit-code

  commits:
    name: lint:commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/workspace-setup

      - name: Lint commit messages
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  a11y:
    name: a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/workspace-setup

      - name: Derive appropriate SHAs for `nx affected` commands
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec nx $NX_SCOPE -t install-browsers

      - name: Run accessibility tests
        run: pnpm exec nx $NX_SCOPE -t a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/**/playwright-report
            apps/**/test-results
          if-no-files-found: ignore
          retention-days: 7
