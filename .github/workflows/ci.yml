name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, typecheck, build, a11y)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/workspace-setup

      - name: Derive appropriate SHAs for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm exec eslint .

      - name: Type check root configs
        run: pnpm exec tsc -p tsconfig.root.json

      - name: Type check affected projects
        run: pnpm exec nx affected -t typecheck

      - name: Build affected projects
        run: pnpm exec nx affected -t build

      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers for affected projects
        run: pnpm exec nx affected -t install-browsers

      - name: Run accessibility tests for affected projects
        run: pnpm exec nx affected -t a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/**/playwright-report
            apps/**/test-results
          if-no-files-found: ignore
          retention-days: 7
