<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Timeline Mockup 05 — Filtered Rail</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f7f3f2, #171414);
        --fg: light-dark(#171414, #f7f3f2);
        --mut: light-dark(#726e6e, #a39e9e);
        --faint: light-dark(#ada8a8, #726e6e);
        --border: light-dark(#cac5c4, #3c3838);
        --line: light-dark(#e5e0df, #272525);
        --card: light-dark(#fdfaf9, #1e1b1b);
        --xp: #4a7ba6;
        --edu: #7c6ba6;
        --proj: #5f9e76;
        --award: #b3893c;
        --other: #a6687c;
        --post: #6b7f92;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        padding: 16px 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        align-items: center;
        max-width: 820px;
        margin: 0 auto;
      }
      .top h1 {
        font-size: 15px;
        font-weight: 650;
        margin-right: auto;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--mut);
        font: inherit;
        font-size: 12px;
        border-radius: 99px;
        padding: 3px 12px 3px 9px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
      }
      .chip::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c, var(--faint));
      }
      .chip[aria-pressed='true'] {
        color: var(--fg);
        border-color: var(--c, var(--fg));
        background: color-mix(in srgb, var(--c, var(--fg)) 12%, transparent);
      }
      .chip small {
        color: var(--faint);
        font-size: 10.5px;
      }
      main {
        max-width: 820px;
        margin: 0 auto;
        padding: 30px 24px 140px;
        position: relative;
      }
      .rail {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 108px;
        width: 2px;
        background: var(--border);
      }
      .nowcap {
        position: absolute;
        left: -3px;
        bottom: -3px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--fg);
      }
      .grp {
        display: grid;
        grid-template-columns: 74px 34px 1fr;
        margin-bottom: 26px;
      }
      .grp > .yr {
        text-align: right;
        padding-top: 2px;
      }
      .grp .yr b {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .grp .yr i {
        display: block;
        font-style: normal;
        font-size: 10px;
        color: var(--faint);
      }
      .track {
        position: relative;
      }
      .track::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 4px;
        bottom: -26px;
        width: 2px;
        margin-left: -1px;
        background: var(--railc, transparent);
      }
      .grp:last-child .track::before {
        display: none;
      }
      .nodes {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        padding-top: 4px;
      }
      .node {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--c);
        box-shadow: 0 0 0 3px var(--bg);
        flex: none;
      }
      .node.thin {
        width: 7px;
        height: 7px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .it {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px 14px;
        transition: border-color 0.15s;
      }
      .it:hover {
        border-color: var(--c);
      }
      .it h3 {
        font-size: 14.5px;
        font-weight: 600;
      }
      .it .meta {
        grid-column: 1;
        font-size: 12px;
        color: var(--mut);
      }
      .it .meta b {
        color: var(--c);
        font-weight: 600;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-right: 6px;
      }
      .it .when {
        grid-row: 1 / span 2;
        grid-column: 2;
        align-self: center;
        font-size: 11.5px;
        color: var(--faint);
        white-space: nowrap;
      }
      details.pp {
        border: 1px dashed var(--border);
        border-radius: 9px;
        padding: 8px 14px;
        font-size: 13px;
      }
      details.pp summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--post);
        font-weight: 600;
        font-size: 12px;
      }
      details.pp summary::-webkit-details-marker {
        display: none;
      }
      details.pp summary::after {
        content: '+';
        font-weight: 400;
        color: var(--faint);
        margin-left: auto;
      }
      details.pp[open] summary::after {
        content: '–';
      }
      details.pp ul {
        list-style: none;
        margin-top: 8px;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      details.pp li {
        display: flex;
        gap: 10px;
        padding: 2px 0;
      }
      details.pp time {
        flex: none;
        width: 40px;
        color: var(--faint);
        font-size: 11px;
      }
      details.pp a {
        color: var(--fg);
        text-decoration: none;
      }
      details.pp a:hover {
        text-decoration: underline;
      }
      .fade {
        animation: fade 0.45s ease both;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @media (max-width: 620px) {
        .grp {
          grid-template-columns: 52px 26px 1fr;
        }
        .rail {
          left: 70px;
        }
        .grp .yr b {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <h1>Jairus Joer · Mockup 05</h1>
      <div
        class="chips"
        id="chips"
      ></div>
    </div>
    <main>
      <div class="rail"><span class="nowcap"></span></div>
      <div id="out"></div>
    </main>
    <script>
      const RAW = `edu|Kooperative Gesamtschule Gronau (Leine)|Matura in Linguistics|2015|2018
      xp|World of Bass Records|Marketing Manager|2015|2016
      xp|XVI CHAPEL|Co-Founder|2016|2017
      edu|Multi Media Berufsbildende Schulen Hannover|Media Design Apprenticeship|2018|2021
      xp|TA Bildungszentrum|Apprentice Media Designer|2018|2019
      xp|neuwaerts|Apprentice Media Designer|2019|2024
      other|neuwaerts|Workshop: New Work|2019
      xp|Freelance|Developer and Designer|2020|Now
      proj|Sesame AI|Social signal analysis for stock trading|2021
      xp|neuwaerts|Junior Frontend Developer|2021|2022
      award|BCM|Content Platforms B2C Gold|2022
      proj|Aggregata|Technical blog about the web and machine learning|2022|2025
      xp|neuwaerts|Full Stack Developer|2022|2024
      post|Aggregata|Include Alpine.js in a production environment|2022-10-09
      post|Aggregata|Interactive forms with Alpine.js|2022-11-25
      post|Aggregata|Visualize and update products with Alpine.js|2022-12-26
      post|Aggregata|Working with Artificial Intelligence|2023-05-02
      post|Aggregata|Colophon: How we build Aggregata|2023-06-12
      post|Aggregata|Temporary and persistent state management with Alpine.js|2023-07-24
      post|Aggregata|How does A.I. learn? Impressions from our first seminar|2023-10-02
      post|Aggregata|One year of Aggregata|2023-10-16
      post|Aggregata|Astro — An introduction to your next project|2023-10-30
      post|Aggregata|Dynamic imports with Alpine.js|2023-11-13
      other|neuwaerts|Workshop: Figma Onboardings for various clients|2023
      other|neuwaerts|Workshop: Working with Figma in real-time|2023
      other|neuwaerts|Workshop: Digital Tools for Clients|2023
      other|neuwaerts|Workshop: Generative Texts|2023
      post|Aggregata|Working with the Arc Browser|2024-01-08
      post|Aggregata|Advanced forms with Alpine.js|2024-02-05
      post|Aggregata|Deploying dynamic content as static HTML|2024-03-18
      post|Aggregata|Beyond bullet points: A dive into Obsidian|2024-04-01
      xp|HERO Software|Senior Full Stack Engineer|2024|2026
      other|HERO Software|Hackathon: Modular dashboard and interface redesign demo|2024
      post|Aggregata|Why we are moving Aggregata from Astro to Ghost|2024-05-13
      post|Aggregata|Develop design systems with accessibility in mind|2024-05-27
      post|Aggregata|Accessibility — a Necessity, not an Afterthought|2024-07-08
      post|Aggregata|Visiting the WeAreDevelopers World Congress 2024|2024-07-22
      post|Aggregata|Crafting a detailed Dialog element using Microinteractions|2024-09-02
      post|Aggregata|Define a Component Library for Designers and Developers|2024-09-16
      post|Aggregata|Adapting and Evolving: Year two of Aggregata|2024-10-14
      post|Aggregata|Create a Component Library for Designers and Developers|2024-10-29
      post|Aggregata|Expand a Component Library for Designers and Developers|2024-11-11
      post|Aggregata|Set up a new project with Tailwind CSS 4.0|2024-12-23
      post|Aggregata|Leverage the View Transition API in any Project|2025-01-06
      post|Aggregata|Improve a Component Library for Designers and Developers|2025-02-17
      post|Aggregata|Cross-Document View Transitions for Multi-Page Applications|2025-03-03
      post|Aggregata|Goodbye Read.cv|2025-04-14
      post|Aggregata|Delightful Animations I: Gallery|2025-05-26
      post|Aggregata|The future of the web might be native|2025-05-31
      post|Aggregata|Migrating the Monolith I: Conceptualization|2025-06-09
      post|Aggregata|Visiting the WeAreDevelopers World Congress 2025|2025-07-21
      post|Aggregata|Delightful Animations II: Tiles|2025-08-04
      post|Aggregata|Delightful Animations III: Intricacies of Interaction Design|2025-09-15
      post|Aggregata|The Sisyphean Struggle for Simplicity|2025-09-29
      other|HERO Software|Workshop: Expectations and Standards for the Design Vision|2025
      other|HERO Software|Hackathon: Complete rework of the software personalisation|2025
      proj|find.ski|Ski data aggregator and comparison portal|2025
      post|Aggregata|Migrating the Monolith II: Design|2025-11-11
      post|Aggregata|Delightful Animations IV: Mind the Gap|2025-11-25
      post|Aggregata|We're saying Goodbye|2025-11-30
      xp|BWI|Senior Software Engineer|2026|Now
      proj|quote.work|Real-time calendar slot bidding embed|2026
      post|Writing|About Personal Software|2026-01-07
      post|Writing|The Future of the Web Ought to Be Native|2026-02-19
      post|Writing|Two Years At HERO Software|2026-03-30
      post|Writing|Demonstrating Software Personalisation|2026-06-02
      post|Writing|Thoughts on Resilience, Sustainability and Sovereignty|2026-07-13
      post|Writing|Working with local AI models|2026-08-01`;

      const NOW = 2026,
        Y0 = 2015;
      const TYPE = {
        xp: ['Work', '--xp'],
        edu: ['Education', '--edu'],
        proj: ['Projects', '--proj'],
        award: ['Awards', '--award'],
        other: ['Other', '--other'],
        post: ['Writing', '--post'],
      };
      const D = RAW.split('\n')
        .map((l) => l.trim().split('|'))
        .map(([t, o, n, f, x]) => ({ t, o, n, f, x, y: +f.slice(0, 4) }));

      let on = new Set(Object.keys(TYPE));

      const chips = document.getElementById('chips');
      function renderChips() {
        chips.innerHTML = Object.entries(TYPE)
          .map(
            ([k, [label, v]]) =>
              `<button class="chip" data-k="${k}" style="--c:var(${v})" aria-pressed="${on.has(k)}">${label} <small>${D.filter((e) => e.t === k).length}</small></button>`,
          )
          .join('');
        chips.querySelectorAll('.chip').forEach((b) =>
          b.addEventListener('click', () => {
            const k = b.dataset.k;
            on.has(k) ? on.delete(k) : on.add(k);
            if (!on.size) on = new Set(Object.keys(TYPE));
            renderChips();
            render();
          }),
        );
      }

      const out = document.getElementById('out');
      function render() {
        out.innerHTML = '';
        for (let y = Y0; y <= NOW; y++) {
          const items = D.filter((e) => e.y === y && on.has(e.t) && e.t !== 'post').sort(
            (a, b) => Object.keys(TYPE).indexOf(a.t) - Object.keys(TYPE).indexOf(b.t),
          );
          const posts = on.has('post') ? D.filter((e) => e.t === 'post' && e.y === y) : [];
          if (!items.length && !posts.length) continue;

          const groups = [];
          if (items.length)
            groups.push(
              `<div class="col">${items
                .map(
                  (e) =>
                    `<div class="it fade" style="--c:var(${TYPE[e.t][1]})"><h3>${e.n}</h3><span class="when">${e.x ? e.y + ' — ' + (e.x === 'Now' ? 'Now' : e.x.slice(0, 4)) : e.y}</span><span class="meta"><b>${TYPE[e.t][0]}</b>${e.o}</span></div>`,
                )
                .join('')}</div>`,
            );
          if (posts.length) {
            const bySrc = {};
            posts.forEach((p) => (bySrc[p.o] ??= []).push(p));
            groups.push(
              `<div class="col">${Object.entries(bySrc)
                .map(
                  ([src, ps]) =>
                    `<details class="pp fade"><summary>✎ ${ps.length} ${src === 'Writing' ? 'post' : 'Aggregata '}${ps.length > 1 ? 's' : ''} · ${src}</summary><ul>${ps
                      .map(
                        (p) =>
                          `<li><time>${new Date(p.f).toLocaleDateString('en', { month: 'short', day: 'numeric' })}</time><a href="#">${p.n}</a></li>`,
                      )
                      .join('')}</ul></details>`,
                )
                .join('')}</div>`,
            );
          }
          const nodes = [
            items.map((e) => `<span class="node" style="--c:var(${TYPE[e.t][1]})"></span>`).join(''),
            posts.length ? `<span class="node thin" style="--c:var(--post)"></span>` : '',
          ].join('');
          out.insertAdjacentHTML(
            'beforeend',
            `<div class="grp fade"><div class="yr"><b>${y}</b>${y === NOW ? '<i>now</i>' : ''}</div><div class="track"><div class="nodes">${nodes}</div></div><div class="col">${groups.join('')}</div></div>`,
          );
        }
      }
      renderChips();
      render();
    </script>
  </body>
</html>
